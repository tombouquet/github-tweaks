<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GitHub Tweaks · Changelog</title>
<link rel="stylesheet" href="src/page.css">
<style>
  .version { color: var(--fg-muted); font-size: 14px; }
  .update {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
    margin: 0 0 24px;
    padding: 12px 16px;
    border: 1px solid var(--accent);
    border-radius: 6px;
    background: color-mix(in srgb, var(--accent) 8%, transparent);
  }
  .update[hidden] { display: none; }
  .update .text { flex: 1; min-width: 240px; }
  .update strong { display: block; }
  .update .steps { color: var(--fg-muted); font-size: 12px; }
  .release { margin-bottom: 16px; padding: 16px; border: 1px solid var(--border); border-radius: 6px; }
  .release.current { border-color: var(--accent); }
  .release h2 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; margin: 0; font-size: 18px; font-weight: 600; }
  .release h2 .date { color: var(--fg-muted); font-size: 12px; font-weight: 400; }
  .release h2 .badge { padding: 0 8px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); font-size: 12px; font-weight: 500; line-height: 20px; }
  .release h3 { margin: 16px 0 4px; font-size: 14px; font-weight: 600; }
  .release ul { margin: 0; padding-left: 20px; }
  .release li + li { margin-top: 4px; }
</style>
</head>
<body>
<header>
  <img src="images/icon-48.png" alt="">
  <h1>Changelog</h1>
  <span class="version" id="version"></span>
  <a class="header-link" href="about.html">All tweaks</a>
</header>
<p class="intro">What's new in each version of GitHub Tweaks.</p>
<div class="update" id="update" role="status" hidden>
  <div class="text">
    <strong id="update-title"></strong>
    <span class="steps">Run <code>git pull</code> in your clone (or download the zip from the release), then click Reload extension.</span>
  </div>
  <a id="update-link" target="_blank" rel="noopener">What's new</a>
  <button type="button" class="primary" id="update-reload">Reload extension</button>
</div>
<main id="changelog"></main>
<script src="src/version.js"></script>
<script src="src/changelog.js"></script>
</body>
</html>
